<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #F4F4F6; }
  .canvas { background: #F4F4F6; }
  .glow {
    background:
      radial-gradient(46% 40% at 26% 20%, rgba(76, 111, 255, 0.20), transparent 70%),
      radial-gradient(40% 40% at 82% 88%, rgba(76, 111, 255, 0.12), transparent 72%);
  }
  .grain { opacity: 0.05; mix-blend-mode: multiply; }
  .word {
    font-weight: 700;
    font-size: 232px;
    line-height: 0.92;
    letter-spacing: -0.035em;
    color: #0B0B0D;
  }
  .rule-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    margin: 34px 0;
  }
  .rule {
    width: 148px;
    height: 2px;
    background: linear-gradient(90deg, rgba(11,11,13,0) 0%, rgba(11,11,13,0.28) 100%);
  }
  .rule.right { transform: scaleX(-1); }
  .cross {
    font-weight: 500;
    font-size: 76px;
    line-height: 1;
    color: #3D5DF0;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="lockup">
      <div class="word">WSN</div>
      <div class="rule-row">
        <span class="rule"></span>
        <span class="cross">&times;</span>
        <span class="rule right"></span>
      </div>
      <div class="word">FHP</div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
