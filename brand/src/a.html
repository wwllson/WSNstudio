<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="base.css">
<style>
  .word {
    font-weight: 700;
    font-size: 232px;
    line-height: 0.92;
    letter-spacing: -0.035em;
    color: #F7F7F8;
  }
  .rule-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    margin: 34px 0;
  }
  .rule {
    width: 148px;
    height: 2px;
    background: linear-gradient(90deg, rgba(247,247,248,0) 0%, rgba(247,247,248,0.34) 100%);
  }
  .rule.right { transform: scaleX(-1); }
  .cross {
    font-weight: 500;
    font-size: 76px;
    line-height: 1;
    color: #4C6FFF;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="lockup">
      <div class="word">WSN</div>
      <div class="rule-row">
        <span class="rule"></span>
        <span class="cross">&times;</span>
        <span class="rule right"></span>
      </div>
      <div class="word">FHP</div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
