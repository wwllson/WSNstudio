<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="base.css">
<style>
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 34px;
    font-weight: 700;
    font-size: 132px;
    letter-spacing: -0.035em;
    color: #F7F7F8;
  }
  .cross {
    font-weight: 400;
    font-size: 88px;
    color: #4C6FFF;
    transform: translateY(-4px);
  }
  .tag {
    margin-top: 42px;
    font-weight: 500;
    font-size: 27px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(247, 247, 248, 0.38);
    padding-left: 0.42em;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="lockup">
      <div class="row"><span>WSN</span><span class="cross">&times;</span><span>FHP</span></div>
      <div class="tag">Digital Partner</div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
